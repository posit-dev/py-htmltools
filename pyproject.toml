[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htmltools"
dynamic = ["version"]
authors = [{ name = "Carson Sievert", email = "carson@rstudio.com" }]
description = "Tools for HTML generation and output."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["html"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = ["typing-extensions>=3.10.0.0", "packaging>=20.9"]
requires-python = ">=3.10"

[project.urls]
"Bug Tracker" = "https://github.com/rstudio/py-htmltools/issues"
Source = "https://github.com/rstudio/py-htmltools"

[dependency-groups]
test = [
  "pytest>=6.2.4",
  "syrupy>=4.6.0",
  "coverage",
  "pyright>=1.1.348",
]
dev = [
  {include-group = "test"},
  "black>=24.2.0",
  "flake8>=6.0.0",
  "Flake8-pyproject",
  "isort>=5.11.2",
  "pre-commit>=2.15.0",
  "tox>=4.0",
  "tox-uv>=1.0",
]

[tool.setuptools]
packages = ["htmltools"]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "htmltools.__version__" }

[tool.setuptools.package-data]
htmltools = ["py.typed"]

[tool.flake8]
ignore = "E203, E302, E402, E501, E704, F403, F405, W503"
extend-exclude = "docs, .venv, venv, typings, e2e, build"

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.tox]
requires = ["tox>=4", "tox-uv>=1"]
env_list = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.tox.env_run_base]
runner = "uv-venv-runner"
description = "Run tests and pyright on {base_python}"
dependency_groups = ["test"]
commands = [
  ["pytest"],
  ["pyright"],
]
